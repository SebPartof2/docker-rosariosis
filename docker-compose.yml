services:

  db:
    image: postgres:15
    volumes:
      # ../files/ survives Dokploy redeploys; ./ (inside code/) does NOT.
      - "../files/plan/db:/var/lib/postgresql/data"
    environment:
      POSTGRES_USER: rosario
      POSTGRES_PASSWORD: rosariopwd
      POSTGRES_DB: rosariosis

  web:
    # Build from the local Dockerfile so the gd and zip extension
    # installs actually run. Requires Compose Type = "Docker Compose".
    build:
      context: .
      # Always pull the newest php:*-apache base so redeploys pick up
      # PHP/Apache/Debian security patches instead of a cached copy.
      pull: true
    # No host port binding: Traefik reaches the container over
    # dokploy-network. Set the domain in Dokploy's Domains tab
    # (Service: web, Container Port: 80).
    expose:
      - "80"
    depends_on:
      - db
    volumes:
      - "../files/plan/rosariosis:/var/www/html"
    environment:
      PGHOST: db
      PGUSER: rosario
      PGPASSWORD: rosariopwd
      PGDATABASE: rosariosis
      ROSARIOSIS_YEAR: 2026
      # In-world location: PHP & PostgreSQL session time zone.
      ROSARIOSIS_TIMEZONE: America/Anchorage
      # Set the value in Dokploy's Environment tab, not here.
      # Generate with: openssl rand -hex 32
      ROSARIO_REST_API_SECRET: ${ROSARIO_REST_API_SECRET}
      # Clerk plugin (plugins/Clerk/README.md). Set the values in Dokploy's
      # Environment tab. Secret key: Clerk Dashboard > API keys.
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY}
      # Frontend API URL, e.g. https://clerk.example.com (Dashboard > Domains).
      CLERK_FRONTEND_API: ${CLERK_FRONTEND_API}
      # Sign in with Clerk: Dashboard > OAuth applications.
      CLERK_OAUTH_CLIENT_ID: ${CLERK_OAUTH_CLIENT_ID}
      CLERK_OAUTH_CLIENT_SECRET: ${CLERK_OAUTH_CLIENT_SECRET}
#      ROSARIOSIS_LANG: 'es_ES'